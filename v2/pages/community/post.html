<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 | BlockRail V2</title><link rel="stylesheet" href="../../css/site.css"></head>
<body><div id="site-header"></div><main class="page-shell"><section id="post" class="panel"><p>게시글을 불러오는 중...</p></section><section id="comments" class="panel"><h2>댓글</h2><form id="comment-form"><textarea id="comment" maxlength="2000" placeholder="댓글을 입력하세요" required></textarea><button>댓글 작성</button></form><div id="comment-list"><p>댓글을 불러오는 중...</p></div></section></main><div id="site-footer"></div>
<script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { auth } from '../../core/firebase/app.js';
import { getPost,listComments,createComment,deletePost,togglePostReaction,toggleCommentReaction,reportPost,subscribeComments } from '../../core/api/community-supabase.js';
import { mountHeader } from '../../components/header.js'; import { mountFooter } from '../../components/footer.js';
mountHeader(); mountFooter();
const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#post'),list=document.querySelector('#comment-list'),form=document.querySelector('#comment-form'),input=document.querySelector('#comment');
let channel=null;
const btn=(text,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b;};
async function renderComments(){const cs=await listComments(id);list.replaceChildren();if(!cs.length){list.textContent='아직 댓글이 없습니다.';return;}for(const c of cs){const card=document.createElement('article');card.className='comment-card';const name=document.createElement('strong'),body=document.createElement('p'),actions=document.createElement('div');name.textContent=c.profiles?.username||'User';body.textContent=c.content||'';actions.append(btn('👍',async()=>{try{await toggleCommentReaction(c.id,'like');await renderComments()}catch(e){alert(e.message)}}),btn('👎',async()=>{try{await toggleCommentReaction(c.id,'dislike');await renderComments()}catch(e){alert(e.message)}}));if(auth.currentUser?.uid===c.author_id)actions.append(btn('삭제',async()=>{if(confirm('댓글을 삭제할까요?')){const {deleteComment}=await import('../../core/api/community-supabase.js');try{await deleteComment(c.id);await renderComments()}catch(e){alert(e.message)}}}));card.append(name,body,actions);list.append(card);}}
async function load(){if(!id){root.textContent='게시글 ID가 없습니다.';return;}try{const post=await getPost(id);root.replaceChildren();const title=document.createElement('h1'),author=document.createElement('p'),content=document.createElement('div'),actions=document.createElement('div');title.textContent=post.title||'제목 없음';author.textContent=`작성자: ${post.profiles?.username||'User'}`;content.className='post-content';content.textContent=post.content||'';actions.append(btn('👍',async()=>{try{await togglePostReaction(id,'like')}catch(e){alert(e.message)}}),btn('👎',async()=>{try{await togglePostReaction(id,'dislike')}catch(e){alert(e.message)}}),btn('신고',async()=>{const r=prompt('신고 사유를 입력하세요');if(r)try{await reportPost(id,r);alert('신고가 접수되었습니다.')}catch(e){alert(e.message)}}));if(auth.currentUser?.uid===post.author_id)actions.append(btn('삭제',async()=>{if(confirm('게시글을 삭제할까요?'))try{await deletePost(id);location.href='index.html';}catch(e){alert(e.message)}}));root.append(title,author,content,actions);await renderComments();if(channel)channel.unsubscribe();channel=subscribeComments(id,()=>renderComments());}catch(e){console.error(e);root.textContent='게시글을 불러오지 못했습니다.';}}
form.onsubmit=async e=>{e.preventDefault();if(!auth.currentUser){alert('Google 로그인이 필요합니다.');return;}try{await createComment(id,input.value);input.value='';await renderComments()}catch(e){alert(e.message)}};
onAuthStateChanged(auth,load);
</script></body></html>
