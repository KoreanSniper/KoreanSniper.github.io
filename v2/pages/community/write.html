<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 | BlockRail V2</title><link rel="stylesheet" href="../../css/site.css"></head>
<body><div id="site-header"></div><main class="page-shell"><section class="panel"><h1>글쓰기</h1><form id="form"><input id="title" maxlength="120" placeholder="제목" required><textarea id="content" maxlength="10000" placeholder="내용" required></textarea><button>작성</button><p id="status"></p></form></section></main><div id="site-footer"></div>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { auth } from "../../core/firebase/app.js"; import { addDocument } from "../../core/api/firestore.js";
import { mountHeader } from "../../components/header.js"; import { mountFooter } from "../../components/footer.js";
mountHeader(); mountFooter();
const form=document.querySelector('#form'), status=document.querySelector('#status');
form.addEventListener('submit',async e=>{e.preventDefault(); const u=auth.currentUser;if(!u){status.textContent='Google 로그인이 필요합니다.';return;}try{const ref=await addDocument('posts',{uid:u.uid,title:document.querySelector('#title').value.trim(),content:document.querySelector('#content').value.trim(),likes:0,dislikes:0,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});location.href=`post.html?id=${ref.id}`;}catch(err){console.error(err);status.textContent='작성에 실패했습니다.';}});
onAuthStateChanged(auth,u=>{if(!u) status.textContent='Google 로그인 후 작성할 수 있습니다.';});
</script></body></html>
