<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로필 | BlockRail V2</title><link rel="stylesheet" href="../../css/site.css"></head>
<body><div id="site-header"></div><main class="page-shell"><section class="panel"><h1>내 프로필</h1><div id="profile">로그인 정보를 불러오는 중...</div></section><section class="panel"><h2>내 게시글</h2><div id="my-posts">불러오는 중...</div></section></main><div id="site-footer"></div>
<script type="module">
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';import {auth} from '../../core/firebase/app.js';import {getUser,getPosts} from '../../core/api/firestore.js';import {mountHeader} from '../../components/header.js';import{mountFooter}from'../../components/footer.js';mountHeader();mountFooter();
const p=document.querySelector('#profile'),list=document.querySelector('#my-posts');onAuthStateChanged(auth,async u=>{if(!u){p.textContent='Google 로그인이 필요합니다.';list.textContent='로그인 후 확인할 수 있습니다.';return;}const user=await getUser(u.uid);p.replaceChildren();const name=document.createElement('h2');name.textContent=user?.username||user?.displayName||u.displayName||'User';const email=document.createElement('p');email.textContent=u.email||'';p.append(name,email);const posts=await getPosts();const mine=posts.filter(x=>x.uid===u.uid);list.replaceChildren();if(!mine.length){list.textContent='작성한 게시글이 없습니다.';return;}for(const post of mine){const a=document.createElement('a');a.href=`post.html?id=${encodeURIComponent(post.id)}`;a.textContent=post.title||'제목 없음';list.append(a,document.createElement('br'));}});
</script></body></html>
